```yaml id="l0sg7w"
#cloud-config

hostname: debian

timezone: Asia/Tokyo

package_update: true
package_upgrade: true

users:
  - name: admin
    groups: sudo
    shell: /usr/bin/zsh
    sudo: ALL=(ALL) NOPASSWD:ALL

    ssh_authorized_keys:
      - YOUR_PUBLIC_KEY

write_files:
  - path: /root/bootstrap.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      apt update

      apt install -y git curl wget sudo

      git clone https://github.com/mottzz87/debian-setup.git /opt/debian-setup

      cd /opt/debian-setup

      bash provision.sh

      sudo -u admin bash user-init.sh

runcmd:
  - bash /root/bootstrap.sh

final_message: "✅ cloud-init finished"
```
