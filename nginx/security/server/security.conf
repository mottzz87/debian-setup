# =========================
# 隐藏文件
# =========================
location ~ /\.(?!well-known).* {
    access_log off;
    log_not_found off;
    return 444;
}

# =========================
# 常见敏感文件
# =========================
location ~* \.(env|ini|log|conf|yml|yaml|sql|bak|old|backup)$ {
    access_log off;
    return 444;
}

# =========================
# Git / 版本控制
# =========================
location ~* /\.(git|svn|hg) {
    access_log off;
    return 444;
}

location ~* /(\\.git|\\.svn|\\.hg) {
    access_log off;
    return 444;
}

# =========================
# Docker / Dev 文件
# =========================
location ~* /(docker-compose|dockerfile|compose\.ya?ml) {
    access_log off;
    return 444;
}

# =========================
# Node 项目文件
# =========================
location ~* /(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml) {
    access_log off;
    return 444;
}

location ~* /(node_modules) {
    access_log off;
    return 444;
}

# =========================
# 压缩包 / 备份包
# =========================
location ~* \.(zip|tar|gz|tgz|rar|7z)$ {
    access_log off;
    return 444;
}

# =========================
# PHP 拦截（如果服务器没有 PHP）
# =========================
location ~ \.php$ {
    access_log off;
    return 444;
}

# =========================
# 常见后台扫描
# =========================
location ~* /(wp-admin|wp-login|phpmyadmin|pma|adminer|xmlrpc\.php) {
    access_log off;
    return 444;
}

# =========================
# 常见框架目录
# =========================
location ~* /(laravel|thinkphp|vendor|storage|runtime) {
    access_log off;
    return 444;
}

# =========================
# 云 / 配置文件
# =========================
location ~* /(actuator|\.aws|\.env\.local) {
    access_log off;
    return 444;
}

# =========================
# macOS 泄露文件
# =========================
location ~ /\.DS_Store {
    access_log off;
    return 444;
}

# =========================
# Apache 文件
# =========================
location ~ /\.ht {
    access_log off;
    return 444;
}

# =========================
# 常见备份路径
# =========================
location ~* /(backup|dump|database|db) {
    access_log off;
    return 444;
}

# =========================
# 扫描器 UA
# =========================
if ($http_user_agent ~* (zgrab|masscan|nmap|sqlmap|nikto|zmap)) {
    access_log off;
    return 444;
}

if ($bad_bot) {
    access_log off;
    return 444;
}